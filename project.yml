name: Amma
options:
  bundleIdPrefix: com.dhana.amma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk.git
    from: 4.8.4

schemes:
  Amma:
    build:
      targets:
        Amma: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Amma:
    type: application
    platform: iOS
    sources:
      - path: Amma
    dependencies:
      - package: GoogleCast
      - sdk: HealthKit.framework
    entitlements:
      path: Amma/Amma.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Not something the app actually uses (it's for correcting workout/
        # estimate algorithms) — picked up by accident via Xcode's
        # "+ Capability" search when adding plain HealthKit. Harmless, but
        # worth removing via Xcode's Signing & Capabilities UI (not by
        # editing this file / regenerating) before App Store submission,
        # since that's the only path that keeps the provisioning profile's
        # capability registration in sync. Recorded here so a future
        # `xcodegen generate` doesn't silently drop it and break the
        # profile that's currently working on-device.
        com.apple.developer.healthkit.recalibrate-estimates: true
    info:
      path: Amma/Info.plist
      properties:
        CFBundleDisplayName: "Amma Appa Arugil - AAA"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "Amma listens when you tap to talk, so it can send your message."
        NSContactsUsageDescription: "Amma looks up phone numbers in your contacts when you ask it to call or message someone by name."
        NSCameraUsageDescription: "Amma can take a photo of your child to show on their profile."
        NSLocalNetworkUsageDescription: "Amma looks for your TV and speakers on your home network so it can cast for you."
        NSHealthShareUsageDescription: "Amma can read your heart rate from your paired Apple Watch so it can gently check in when it seems elevated."
        NSBonjourServices:
          - _googlecast._tcp
          - _592BF965._googlecast._tcp
        LSApplicationQueriesSchemes:
          - whatsapp
          - tel
          - telprompt
        CFBundleURLTypes:
          - CFBundleURLName: com.dhana.amma
            CFBundleURLSchemes:
              - amma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dhana.amma
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H72SV43N57
