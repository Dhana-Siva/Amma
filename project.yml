name: Amma
options:
  bundleIdPrefix: com.dhana.amma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Amma:
    type: application
    platform: iOS
    sources:
      - path: Amma
    info:
      path: Amma/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "Amma listens when you tap to talk, so it can send your message."
        NSLocalNetworkUsageDescription: "Amma looks for your TV and speakers on your home network so it can cast for you."
        LSApplicationQueriesSchemes:
          - whatsapp
          - tel
          - telprompt
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dhana.amma
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H72SV43N57
