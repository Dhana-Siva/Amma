name: Amma
options:
  bundleIdPrefix: com.dhana.amma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk.git
    from: 4.8.4
  # Google's own officially-maintained WKWebView + IFrame Player API
  # wrapper — switched to this after two failed hand-rolled iframe
  # attempts (raw HTML page, then a custom user agent) both still hit
  # YouTube's undocumented embedding-client validation ("Video
  # unavailable, error 152-4") on a real device. A bare iframe is
  # inherently working around behavior Google hasn't documented; this
  # library is built specifically to handle that reliably instead.
  YouTubeiOSPlayerHelper:
    url: https://github.com/youtube/youtube-ios-player-helper.git
    from: 1.0.4

schemes:
  Amma:
    build:
      targets:
        Amma: all
        AmmaWidget: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Amma:
    type: application
    platform: iOS
    sources:
      - path: Amma
    dependencies:
      - package: GoogleCast
      - package: YouTubeiOSPlayerHelper
      - target: AmmaWidget
        embed: true
    info:
      path: Amma/Info.plist
      properties:
        CFBundleDisplayName: "Amma Appa Arugil - AAA"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "Amma listens when you tap to talk, so it can send your message."
        NSContactsUsageDescription: "Amma looks up phone numbers in your contacts when you ask it to call or message someone by name."
        NSCameraUsageDescription: "Amma can take a photo of your child to show on their profile."
        NSLocalNetworkUsageDescription: "Amma looks for your TV and speakers on your home network so it can cast for you."
        # Required for ReturnActivityService's Activity.request(...) to
        # succeed — without it, starting a Live Activity throws at runtime.
        NSSupportsLiveActivities: true
        NSBonjourServices:
          - _googlecast._tcp
          - _592BF965._googlecast._tcp
        LSApplicationQueriesSchemes:
          - whatsapp
          - tel
          - telprompt
        CFBundleURLTypes:
          - CFBundleURLName: com.dhana.amma
            CFBundleURLSchemes:
              - amma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dhana.amma
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H72SV43N57

  # Renders the "return to Amma" Live Activity (Dynamic Island / Lock
  # Screen) started by ReturnActivityService in the main app. Shares
  # ReturnActivityAttributes.swift with the Amma target — see its sources
  # below — since ActivityKit requires the same attributes type to be
  # visible to both the starter and the renderer.
  AmmaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AmmaWidget
      - path: Amma/Shared/ReturnActivityAttributes.swift
    info:
      path: AmmaWidget/Info.plist
      properties:
        CFBundleDisplayName: "Amma"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dhana.amma.AmmaWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H72SV43N57
        SKIP_INSTALL: true
